<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maç Analiz">
<title>Maç Analiz</title>
<style>
:root{--bg:#f3f1ea;--sf:#fff;--tx:#1b2a22;--mu:#667268;--ln:#d9d5c7;--ac:#0f6b3f;--hi:#c77d00;--bad:#b3392f;--good:#13814b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a14;--sf:#16271e;--tx:#e9efe6;--mu:#93a498;--ln:#2a4034;--ac:#4cc98a;--hi:#f0b429;--bad:#ff7b6e;--good:#4cc98a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next",system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:20px 0 8px}
p.s{color:var(--mu);font-size:13px;margin:0 0 12px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
button{cursor:pointer;background:var(--ac);color:var(--bg);border:0;font-weight:700}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:500;text-align:left}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:13px;font-weight:700;margin:6px 0}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0}
.b1{background:#0f6b3f}.bx{background:#7a847d}.b2{background:#a65a1c}
.k{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);font-size:15px}.k:last-child{border:0}
.mu{color:var(--mu)}.pos{color:var(--good);font-weight:700}.neg{color:var(--bad)}
.big{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.odds label{font-size:12px;color:var(--mu)}.odds input{padding:8px}
.err{color:var(--bad);font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 2px;text-align:left}th{color:var(--mu);font-weight:500}
</style>
</head>
<body>
<main>
<h1>Maç Analiz</h1>
<p class="s">xG verisiyle Poisson tabanlı olasılık modeli. Kesin sonuç vermez, olasılık hesaplar.</p>

<div class="box" id="keybox">
  <div class="row"><input id="key" type="password" placeholder="PitchAPI anahtarı (pk_live_...)" autocomplete="off"><button id="savekey" style="flex:0 0 90px">Kaydet</button></div>
  <p class="s" style="margin:0">Anahtar yalnızca bu telefonun tarayıcısında saklanır.</p>
</div>

<div id="app" hidden>
  <select id="lg"></select>
  <div class="row" style="margin-top:8px"><button id="load">Maçları getir</button></div>
  <div id="list"></div>
  <div id="out"></div>
</div>
<div id="msg" class="err"></div>
</main>

<script>
const BASE="https://api.pitchapi.dev",$=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let KEY=store.get("pk")||"",leagues=[],pool=[];
const xgCache=JSON.parse(store.get("xg")||"{}");

async function api(p,tries=3){
  for(let i=0;i<tries;i++){
    const r=await fetch(BASE+p,{headers:{"X-API-KEY":KEY}});
    if(r.status===429){await new Promise(s=>setTimeout(s,(+r.headers.get("Retry-After")||2)*1000));continue}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
    return j.data;
  }
  throw new Error("İstek sınırı, biraz sonra tekrar dene");
}
const err=t=>$("msg").textContent=t||"";

function init(){
  $("key").value=KEY;
  if(KEY){$("app").hidden=false;loadLeagues()}
}
$("savekey").onclick=()=>{KEY=$("key").value.trim();store.set("pk",KEY);err();if(KEY){$("app").hidden=false;loadLeagues()}};

async function loadLeagues(){
  try{
    const d=await api("/v1/leagues");leagues=d.leagues.sort((a,b)=>(a.country_code+a.name).localeCompare(b.country_code+b.name));
    $("lg").innerHTML=leagues.map(l=>`<option value="${l.id}">${l.name} (${l.country_code||"-"})</option>`).join("");
    const last=store.get("lg");if(last)$("lg").value=last;
  }catch(e){err("Ligler alınamadı: "+e.message+". Anahtarı kontrol et. Tarayıcı engeli (CORS) olabilir.")}
}

$("load").onclick=async()=>{
  err();$("out").innerHTML="";$("list").innerHTML="Yükleniyor...";
  const id=$("lg").value;store.set("lg",id);
  try{
    const lg=leagues.find(l=>l.id===id),ss=(lg.seasons||[]).slice(0,2);
    const parts=await Promise.all(ss.map(s=>api(`/v1/leagues/${id}/matches?season=${encodeURIComponent(s)}&status=all`)));
    pool=parts.flatMap(p=>p.matches);
    const now=Date.now();
    const up=pool.filter(m=>m.score_home==null&&new Date(m.time_utc)>now-3*3600e3).sort((a,b)=>a.time_utc.localeCompare(b.time_utc)).slice(0,25);
    if(!up.length){$("list").innerHTML='<p class="s">Yaklaşan maç bulunamadı.</p>';return}
    $("list").innerHTML='<h2>Yaklaşan maçlar</h2>'+up.map(m=>`<button class="g" style="margin-bottom:6px" data-id="${m.id}">${m.home_team.name} - ${m.away_team.name}<br><span class="mu" style="font-size:12px">${new Date(m.time_utc).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></button>`).join("");
    $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>analyze(up.find(m=>m.id===b.dataset.id)));
  }catch(e){$("list").innerHTML="";err("Maçlar alınamadı: "+e.message)}
};

async function getXg(id){
  if(xgCache[id])return xgCache[id];
  try{
    const d=await api(`/v1/matches/${id}/stats`),per=d.periods.find(p=>p.period==="All")||d.periods[0];
    for(const g of per.groups)for(const it of g.items)if(it.key==="expected_goals"){
      const v=[parseFloat(it.home),parseFloat(it.away)];
      if(v.every(isFinite)){xgCache[id]=v;store.set("xg",JSON.stringify(xgCache));return v}
    }
  }catch(e){}
  return null;
}
async function pooled(arr,n,fn){const out=[];let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<arr.length){const k=i++;out[k]=await fn(arr[k])}}));return out}

async function form(teamId,N=10){
  const ms=pool.filter(m=>m.score_home!=null&&(m.home_team.id===teamId||m.away_team.id===teamId)).sort((a,b)=>b.time_utc.localeCompare(a.time_utc)).slice(0,N);
  const xs=await pooled(ms,5,m=>getXg(m.id));
  return ms.map((m,i)=>{const h=m.home_team.id===teamId,x=xs[i];
    return{date:m.date,h,opp:(h?m.away_team:m.home_team).name,gf:h?m.score_home:m.score_away,ga:h?m.score_away:m.score_home,xf:x?(h?x[0]:x[1]):null,xa:x?(h?x[1]:x[0]):null}});
}
function strength(f,g,k=2.5){
  let wf=0,wa=0,ws=0;
  f.forEach((r,i)=>{const w=Math.pow(.88,i);
    wf+=w*(r.xf!=null?.65*r.xf+.35*r.gf:r.gf);wa+=w*(r.xa!=null?.65*r.xa+.35*r.ga:r.ga);ws+=w});
  return{att:(wf+k*g)/(ws+k)/g,def:(wa+k*g)/(ws+k)/g}
}
const pois=(l,n)=>{let p=Math.exp(-l),a=[p];for(let i=1;i<=n;i++){p*=l/i;a.push(p)}return a};
function model(lh,la,rho=-.08){
  const N=9,ph=pois(lh,N),pa=pois(la,N);let M=[],s=0;
  for(let i=0;i<=N;i++){M[i]=[];for(let j=0;j<=N;j++){let t=1;
    if(i<2&&j<2)t=i==0&&j==0?1-lh*la*rho:i==0&&j==1?1+lh*rho:i==1&&j==0?1+la*rho:1-rho;
    M[i][j]=ph[i]*pa[j]*t;s+=M[i][j]}}
  const r={h:0,x:0,a:0,o15:0,o25:0,o35:0,btts:0,sc:[]};
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const p=M[i][j]/s;
    i>j?r.h+=p:i==j?r.x+=p:r.a+=p;
    if(i+j>1)r.o15+=p;if(i+j>2)r.o25+=p;if(i+j>3)r.o35+=p;if(i&&j)r.btts+=p;r.sc.push([i+"-"+j,p])}
  r.sc.sort((a,b)=>b[1]-a[1]);return r;
}
const pc=p=>(p*100).toFixed(0)+"%",fo=p=>(1/p).toFixed(2);

async function analyze(m){
  err();$("out").innerHTML='<p class="s">Son maçların xG verisi çekiliyor...</p>';
  $("out").scrollIntoView({behavior:"smooth"});
  try{
    const played=pool.filter(x=>x.score_home!=null).sort((a,b)=>b.time_utc.localeCompare(a.time_utc)).slice(0,400);
    if(played.length<30)throw new Error("Lig için yeterli geçmiş maç yok");
    const aH=played.reduce((s,x)=>s+x.score_home,0)/played.length,aA=played.reduce((s,x)=>s+x.score_away,0)/played.length;
    const g=(aH+aA)/2,ha=Math.min(1.35,Math.max(.8,Math.sqrt(aH/aA)));
    const [fh,fa]=await Promise.all([form(m.home_team.id),form(m.away_team.id)]);
    if(!fh.length||!fa.length)throw new Error("Takımların geçmiş maçı bulunamadı");
    const sh=strength(fh,g),sa=strength(fa,g);
    const lh=g*ha*sh.att*sa.def,la=g/ha*sa.att*sh.def,r=model(lh,la);
    const n=Math.min(fh.length,fa.length),cov=[...fh,...fa].filter(x=>x.xf!=null).length/(fh.length+fa.length);
    const conf=n>=8&&cov>.7?"Yüksek":n>=5&&cov>.4?"Orta":"Düşük";
    const frm=(f)=>`<table><tr><th>Rakip</th><th>Skor</th><th>xG</th></tr>${f.slice(0,6).map(x=>`<tr><td>${x.h?"E":"D"} ${x.opp}</td><td>${x.gf}-${x.ga}</td><td class="mu">${x.xf!=null?x.xf.toFixed(1)+"-"+x.xa.toFixed(1):"-"}</td></tr>`).join("")}</table>`;
    const mk=[["MS1",r.h],["MSX",r.x],["MS2",r.a],["2,5 Üst",r.o25],["2,5 Alt",1-r.o25],["KG Var",r.btts],["KG Yok",1-r.btts]];
    window._mk=mk;
    $("out").innerHTML=`
    <div class="box"><div class="big">${m.home_team.name} - ${m.away_team.name}</div>
      <p class="s" style="text-align:center">Beklenen gol: ${lh.toFixed(2)} - ${la.toFixed(2)}. Güven: <b>${conf}</b> (${n} maç, xG kapsamı ${pc(cov)})</p>
      <div class="bar"><span class="b1" style="flex:${r.h}">${pc(r.h)}</span><span class="bx" style="flex:${r.x}">${pc(r.x)}</span><span class="b2" style="flex:${r.a}">${pc(r.a)}</span></div></div>
    <div class="box">${mk.map(([n,p])=>`<div class="k"><span>${n}</span><span><b>${pc(p)}</b> <span class="mu">adil oran ${fo(p)}</span></span></div>`).join("")}
      <div class="k"><span>1,5 Üst / 3,5 Üst</span><span><b>${pc(r.o15)} / ${pc(r.o35)}</b></span></div>
      <div class="k"><span>Olası skorlar</span><span>${r.sc.slice(0,5).map(s=>s[0]+" ("+pc(s[1])+")").join(", ")}</span></div></div>
    <h2>Bahis oranlarını gir, değer farkını gör</h2>
    <div class="box"><div class="odds">${mk.map(([n],i)=>`<div><label>${n}</label><input inputmode="decimal" data-i="${i}" placeholder="oran"></div>`).join("")}</div><div id="edge" style="margin-top:10px"></div>
    <p class="s" style="margin:8px 0 0">Fark = olasılık x oran - 1. Yüzde 5 üstü, modele göre oran yüksek demektir. Model hata yapabilir.</p></div>
    <h2>Form (E ev, D deplasman)</h2><div class="box"><b>${m.home_team.name}</b>${frm(fh)}</div><div class="box"><b>${m.away_team.name}</b>${frm(fa)}</div>`;
    $("out").querySelectorAll("input").forEach(i=>i.oninput=()=>{
      $("edge").innerHTML=[...$("out").querySelectorAll("input")].map(x=>{
        const o=parseFloat(x.value.replace(",","."));if(!(o>1))return"";
        const [n,p]=window._mk[+x.dataset.i],e=p*o-1;
        return`<div class="k"><span>${n} @ ${o}</span><span class="${e>.05?"pos":e<0?"neg":"mu"}">${e>0?"+":""}${(e*100).toFixed(1)}%</span></div>`}).join("")});
  }catch(e){$("out").innerHTML="";err("Analiz yapılamadı: "+e.message)}
}
init();
</script>
</body>
</html>
